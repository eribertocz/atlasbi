# Local infrastructure for the "equipo local mínimo" deployment level (docs/11 §4.4).
# Driven by `pnpm dev` / `pnpm stack:up` through `podman compose`. Every image is pinned to an
# exact tag — never `:latest` — and the versions are justified in docs/versions.md.
#
# Services without a `profiles` key form the CORE profile (docs/19 §4). Later build steps add
# Airflow/Electric/OpenMetadata behind their own profiles. The portable tier (sqlite catalog) starts
# neither the object storage nor Cube: the platform CLI names the services it starts.
name: atlasbi

# The fixed address of the platform's proxy (the `web` service) on the edge network: the only
# client whose X-Forwarded-For the API gateway trusts (ATLASBI_TRUSTED_PROXIES, docs/06 §6.3).
x-web-address: &web-address 10.89.250.10

services:
  postgres:
    image: docker.io/library/postgres:17.11-trixie
    environment:
      POSTGRES_USER: ${ATLASBI_POSTGRES_USER:?set ATLASBI_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${ATLASBI_POSTGRES_PASSWORD:?set ATLASBI_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${ATLASBI_POSTGRES_DB:?set ATLASBI_POSTGRES_DB in .env}
    ports:
      # Loopback only: the local database is never exposed to the rest of the network.
      - 127.0.0.1:${ATLASBI_POSTGRES_PORT:-55432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [default, semantic]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  otel-collector:
    # Core distribution: it already ships otlp, batch, debug and health_check — the contrib
    # image would add hundreds of unused components to the attack surface.
    image: docker.io/otel/opentelemetry-collector:0.161.0
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - ./infra/local/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    # The platform's own services report here from the internal network.
    networks: [default, semantic]
    ports:
      - 127.0.0.1:${ATLASBI_OTEL_GRPC_PORT:-4317}:4317
      - 127.0.0.1:${ATLASBI_OTEL_HTTP_PORT:-4318}:4318
      - 127.0.0.1:${ATLASBI_OTEL_HEALTH_PORT:-13133}:13133
    restart: unless-stopped

  object-storage:
    # Garage — the S3-compatible object storage of the "equipo local" tier (docs/11 §4.4). AGPL-3.0,
    # run unmodified as a separate service, never distributed with the platform (docs/21 §11).
    # Pinned by digest. The bucket and the lakehouse keys are set up by `pnpm bootstrap` through the
    # admin API, from .env — this file only starts the server.
    image: docker.io/dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    command: ['/garage', 'server', '--single-node']
    environment:
      GARAGE_RPC_SECRET: ${ATLASBI_OBJECT_STORAGE_RPC_SECRET:?set ATLASBI_OBJECT_STORAGE_RPC_SECRET in .env}
      GARAGE_ADMIN_TOKEN: ${ATLASBI_OBJECT_STORAGE_ADMIN_TOKEN:?set ATLASBI_OBJECT_STORAGE_ADMIN_TOKEN in .env}
    volumes:
      - ./infra/local/garage.toml:/etc/garage.toml:ro
      - object-storage-data:/var/lib/garage
    networks: [default, semantic]
    ports:
      # Loopback only, like Postgres: the S3 API and the admin API.
      - 127.0.0.1:${ATLASBI_OBJECT_STORAGE_PORT:-53900}:3900
      - 127.0.0.1:${ATLASBI_OBJECT_STORAGE_ADMIN_PORT:-53903}:3903
    healthcheck:
      # The image has no shell; its own CLI reports the node's health.
      test: ['CMD', '/garage', 'status']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  cube-store:
    # Cube Store — the semantic layer's pre-aggregation cache (docs/04 §6.3, docs/17 §8): a single
    # node in the local tier. Pinned by digest, like Cube itself (packages/semantic/src/cube-images.ts).
    image: docker.io/cubejs/cubestore:v1.7.45@sha256:888a9eb901b1f313836b4d5f1d19ffe035cf0e6595dafa6b6fc03a9daa28523b
    environment:
      CUBESTORE_DATA_DIR: /cube/data/local
      CUBESTORE_REMOTE_DIR: /cube/data/remote
      CUBESTORE_TELEMETRY: 'false'
    volumes:
      - cube-store-data:/cube/data
    networks: [semantic]
    restart: unless-stopped

  cube:
    # Cube Core — the semantic layer (docs/04). Secure mode from the first day (docs/17 §8), no
    # telemetry, and the lakehouse read as its reader only: the SELECT-only catalog role and the
    # read-only storage key (docs/01 §6.7). packages/semantic/cube/cube.js opens it the platform's way.
    image: docker.io/cubejs/cube:v1.7.45@sha256:c4dae518806fdedc78b623192ffd187df46d32d212985306a8adf7b1482804a1
    depends_on:
      - postgres
      - object-storage
      - cube-store
    environment:
      NODE_ENV: production
      CUBEJS_DEV_MODE: 'false'
      CUBEJS_TELEMETRY: 'false'
      CUBEJS_DB_TYPE: duckdb
      # Not read by Cube. It compiles the model once, so the platform CLI passes a digest of
      # packages/semantic/cube here: when the model changes, `compose up` recreates Cube; when it
      # does not, the running container and its queries are left alone (decision D3).
      ATLASBI_SEMANTIC_MODEL_VERSION: ${ATLASBI_SEMANTIC_MODEL_VERSION:-}
      CUBEJS_API_SECRET: ${ATLASBI_SEMANTIC_API_SECRET:-}
      # The SQL API takes the platform's short query token as the password (cube/cube.js).
      CUBEJS_PG_SQL_PORT: '15432'
      CUBEJS_CUBESTORE_HOST: cube-store
      # One instance serves queries and refreshes pre-aggregations in the local tier.
      CUBEJS_REFRESH_WORKER: 'true'
      # The lakehouse, as its reader. `:-` rather than `:?` so the portable tier's compose file still
      # parses; the platform CLI checks these secrets before it starts Cube.
      ATLASBI_LAKEHOUSE_CATALOG_READER_URL: ${ATLASBI_LAKEHOUSE_CATALOG_READER_URL:-}
      ATLASBI_LAKEHOUSE_CATALOG_HOST: postgres
      ATLASBI_LAKEHOUSE_CATALOG_PORT: '5432'
      ATLASBI_LAKEHOUSE_S3_URL: ${ATLASBI_LAKEHOUSE_S3_URL:-s3://lakehouse/data/}
      ATLASBI_LAKEHOUSE_S3_ENDPOINT: object-storage:3900
      ATLASBI_LAKEHOUSE_S3_REGION: ${ATLASBI_LAKEHOUSE_S3_REGION:-garage}
      ATLASBI_LAKEHOUSE_S3_USE_SSL: ${ATLASBI_LAKEHOUSE_S3_USE_SSL:-false}
      ATLASBI_LAKEHOUSE_S3_READER_ACCESS_KEY_ID: ${ATLASBI_LAKEHOUSE_S3_READER_ACCESS_KEY_ID:-}
      ATLASBI_LAKEHOUSE_S3_READER_SECRET_ACCESS_KEY: ${ATLASBI_LAKEHOUSE_S3_READER_SECRET_ACCESS_KEY:-}
    volumes:
      - ./packages/semantic/cube:/cube/conf:ro
      # The DuckDB extensions for the container's platform (linux_*), installed by `pnpm bootstrap`
      # next to the host's own: Cube never downloads one.
      - ${ATLASBI_DUCKDB_EXTENSION_DIRECTORY:-./.data/duckdb/extensions}:/duckdb/extensions:ro
    # No way out of the stack: Cube needs nothing from the Internet, so it gets no route to it.
    networks: [semantic]
    ports:
      - 127.0.0.1:${ATLASBI_CUBE_PORT:-4000}:4000
      - 127.0.0.1:${ATLASBI_CUBE_SQL_PORT:-15432}:15432
    restart: unless-stopped

  api-gateway:
    # The platform's API (docs/06), from its own image (infra/images/api-gateway.Containerfile).
    # `pnpm dev` runs it as a local process with hot reload instead; `pnpm stack:up` builds and
    # runs this container (docs/19 §2). It publishes no port: the browser reaches it through `web`.
    image: localhost/atlasbi/api-gateway:dev
    build:
      context: .
      dockerfile: infra/images/api-gateway.Containerfile
    environment:
      ATLASBI_ENV: ${ATLASBI_ENV:-development}
      ATLASBI_LAKEHOUSE_CATALOG_TYPE: ${ATLASBI_LAKEHOUSE_CATALOG_TYPE:-postgres}
      # Only what the gateway uses (gatewaySecretKeys): the platform database, the identity secret
      # and the one it signs Cube's query tokens with. The database URL — the address inside the
      # stack, every part percent-encoded — is built by the platform CLI for each compose command
      # it runs (stackDatabaseUrl); compose run by hand leaves it empty, and the gateway stops at
      # startup saying the database URL is missing.
      ATLASBI_DATABASE_URL: ${ATLASBI_STACK_DATABASE_URL:-}
      ATLASBI_AUTH_SECRET: ${ATLASBI_AUTH_SECRET:-}
      ATLASBI_SEMANTIC_API_SECRET: ${ATLASBI_SEMANTIC_API_SECRET:-}
      ATLASBI_SEMANTIC_URL: http://cube:4000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      ATLASBI_GATEWAY_HOST: 0.0.0.0
      ATLASBI_GATEWAY_PORT: '4100'
      ATLASBI_PUBLIC_URL: ${ATLASBI_PUBLIC_URL:-http://127.0.0.1:3000}
      ATLASBI_TRUSTED_PROXIES: *web-address
    # Internal networks only: the gateway needs nothing from the Internet.
    networks: [semantic, edge]
    read_only: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4100/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  web:
    # The single HTTP entry point (docs/19 §10): the web app's static build and the proxy to the
    # gateway, from its own image (infra/images/web.Containerfile, Caddy). `pnpm dev` runs Vite's
    # development server in its place.
    image: localhost/atlasbi/web:dev
    build:
      context: .
      dockerfile: infra/images/web.Containerfile
    depends_on:
      - api-gateway
    environment:
      ATLASBI_GATEWAY_UPSTREAM: api-gateway:4100
    networks:
      edge:
        ipv4_address: *web-address
    ports:
      - 127.0.0.1:${ATLASBI_WEB_PORT:-3000}:8080
    read_only: true
    # Where Caddy keeps its state; nothing of it outlives the container.
    tmpfs:
      - /config
      - /data
    restart: unless-stopped

networks:
  default:
  # Internal: its containers reach each other and publish ports on 127.0.0.1, but have no route to
  # the Internet. Cube and Cube Store live only here; Postgres and the object storage join it.
  semantic:
    internal: true
  # Internal too: the proxy publishes its port on 127.0.0.1 and talks to the gateway; neither has
  # a route out. A fixed subnet, so the proxy's address — the one the gateway trusts — never moves.
  edge:
    internal: true
    ipam:
      config:
        - subnet: 10.89.250.0/24

volumes:
  postgres-data:
  object-storage-data:
  cube-store-data:
