[project]
name = "atlasbi-transform"
version = "0.0.0"
description = "SQLMesh project of the lakehouse (build step 2). Run it through `pnpm transform`, never directly."
requires-python = ">=3.13,<3.14"
dependencies = [
  "sqlmesh[postgres]==0.236.2",
  "duckdb==1.5.5",
]

[tool.uv]
package = false
# Same supply-chain brake as pnpm's minimumReleaseAge: nothing published in the last day resolves.
exclude-newer = "1 day"
