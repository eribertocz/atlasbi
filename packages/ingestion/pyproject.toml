[project]
name = "atlasbi-ingestion"
version = "0.0.0"
description = "Ingestion runner (build step 7): dlt into a minimal landing in DuckLake. Run it through `pnpm ingest`, never directly."
requires-python = ">=3.13,<3.14"
dependencies = [
  "dlt[ducklake]==1.30.0",
  "duckdb==1.5.5",
]

[tool.uv]
package = false
# Same supply-chain brake as pnpm's minimumReleaseAge: nothing published in the last day resolves.
exclude-newer = "1 day"
